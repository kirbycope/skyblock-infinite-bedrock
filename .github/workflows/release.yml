name: Release

# Publishes skyblock-infinite-bedrock.mctemplate as a GitHub Release asset.
# Trigger it by pushing a version tag, or manually from the Actions tab:
#   git tag v1.1.18 && git push origin v1.1.18
# The archive is built from the repository by tools/build_addon.py into build/.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g. v1.1.18)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Static tests
        run: python3 -m unittest discover -s tests -v

      - name: Build skyblock-infinite-bedrock.mctemplate
        run: python3 tools/build_addon.py

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: build/skyblock-infinite-bedrock.mctemplate
          generate_release_notes: true
